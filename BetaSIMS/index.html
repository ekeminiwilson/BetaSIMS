<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetaSIMS | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gradient-to-r from-blue-900 via-blue-700 to-indigo-900 min-h-screen flex items-center justify-center">

<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

    <div class="text-center">

        <div class="text-6xl mb-4">
            🎓
        </div>

        <h1 class="text-3xl font-bold text-blue-800">
            BetaSIMS
        </h1>

        <p class="text-gray-500 mt-2">
            Student Information Management System
        </p>

    </div>

    <form id="loginForm" class="mt-8">

        <label class="font-semibold block mb-2">
            Username
        </label>

        <input
            id="username"
            type="text"
            class="w-full border rounded-lg p-3 mb-5 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter username">

        <label class="font-semibold block mb-2">
            Password
        </label>

        <div class="relative">

            <input
                id="password"
                type="password"
                class="w-full border rounded-lg p-3 pr-20 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter password">

            <button
                type="button"
                onclick="togglePassword()"
                class="absolute right-3 top-3 text-blue-700 font-semibold">

                Show

            </button>

        </div>

        <button
            class="w-full bg-blue-700 hover:bg-blue-800 text-white py-3 rounded-lg mt-8">

            Login

        </button>

        <p
            id="message"
            class="text-red-600 text-center mt-4">
        </p>

    </form>

</div>

<script src="js/login.js"></script>

</body>
</html>
