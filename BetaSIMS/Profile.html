<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-gray-100">

<div class="max-w-3xl mx-auto mt-10">

<div class="bg-white rounded-xl shadow-lg p-8">

<div class="text-center">

<img
src="https://ui-avatars.com/api/?name=Student"
class="w-40 h-40 rounded-full mx-auto border-4 border-blue-700">

<h1 class="text-3xl font-bold mt-5">
Student Profile
</h1>

</div>

<div class="grid md:grid-cols-2 gap-6 mt-10">

<div>

<h3 class="font-bold">Full Name</h3>

<p id="profileName">John Peter</p>

</div>

<div>

<h3 class="font-bold">Matric Number</h3>

<p id="profileMatric">CSC/24/001</p>

</div>

<div>

<h3 class="font-bold">Department</h3>

<p id="profileDepartment">
Computer Science
</p>

</div>

<div>

<h3 class="font-bold">Level</h3>

<p id="profileLevel">300</p>

</div>

</div>

<div class="mt-8 flex gap-4">

<button
onclick="window.print()"
class="bg-green-600 text-white px-5 py-3 rounded">

Print Profile

</button>

<a
href="students.html"
class="bg-blue-700 text-white px-5 py-3 rounded">

Back

</a>

</div>

</div>

</div>

</body>
</html>
